<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | MyRunningIQ</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="forgot-password-body">

    <div class="forgot-password-container">

        <img
            src="images/LogoBlack.png"
            class="forgot-password-logo"
            alt="MyRunningIQ"
        >

        <h1 class="forgot-password-title">
            Reset Password
        </h1>

        <p class="forgot-password-subtitle">
            Enter the email associated with your account
            and we'll send you a password reset link.
        </p>

        <form
            id="forgot-password-form"
            class="forgot-password-form"
        >

            <input
                type="email"
                id="reset-email"
                class="forgot-password-input"
                placeholder="Email Address"
                required
            >

            <p
                id="forgot-password-message"
                class="forgot-password-message"
                role="status"
            ></p>

            <button
                type="submit"
                class="forgot-password-button"
            >
                Send Reset Link
            </button>

        </form>

        <a
            href="login.html"
            class="forgot-password-back"
        >
            &larr; Back to Login
        </a>

    </div>

    <script
        type="module"
        src="js/forgot-password.js"
    ></script>

</body>

</html>
