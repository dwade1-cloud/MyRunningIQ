<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | MyRunningIQ</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="signup-body">

    <div class="signup-container">

        <img src="images/LogoBlack.png" alt="MyRunningIQ Logo" class="signup-logo">

        <h1 class="signup-title">Create Your Free Account</h1>

        <p class="signup-subtitle">
            Start tracking your training today.
        </p>

        <form class="signup-form" id="signup-form">

            <input
                type="text"
                placeholder="Full Name"
                class="signup-input"
                id="full-name"
            >

            <input
                type="email"
                placeholder="Email Address"
                class="signup-input"
                id="email"
            >

            <input
                type="password"
                placeholder="Password"
                class="signup-input"
                id="password"
            >

            <input
                type="password"
                placeholder="Confirm Password"
                class="signup-input"
                id="confirm-password"
            >

            <label class="signup-checkbox-row">
                <input type="checkbox" id="agreeTerms">
                <span>I agree to the Terms of Service and Privacy Policy</span>
            </label>

            <button class="signup-button" type="submit">
                Create Free Account
            </button>

        </form>

        <p class="signup-login-text">
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

    </div>

    <script type="module" src="js/signup.js"></script>

</body>
</html>
